name: Publicar site e APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Testar e gerar site offline
        run: npm run check

      - name: Sincronizar projeto Android
        run: npx cap sync android

      - name: Gerar APK Android
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Adicionar APK ao site
        run: |
          mkdir -p www/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk www/downloads/serene-reader-android.apk
          cd www/downloads
          sha256sum serene-reader-android.apk > serene-reader-android.apk.sha256

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site para o Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: www

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
